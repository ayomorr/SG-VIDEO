<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Detect Web Tracker</title>
    <style>
      body { width: 320px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: #0b1b2b; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.sub { font-size: 12px; color: #64748b; margin: 0 0 12px; }
      ul { list-style: none; margin: 0 0 14px; padding: 0; }
      li { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #eef2f7; }
      .empty { font-size: 13px; color: #64748b; }
      button { width: 100%; padding: 10px; border: 0; border-radius: 9999px; background: #00c2a8; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
      button.secondary { background: #0b1b2b; margin-top: 8px; }
      textarea { width: 100%; height: 110px; margin-top: 10px; box-sizing: border-box; font-size: 11px; border-radius: 10px; border: 1px solid #dbe3ed; padding: 8px; }
      .fmt { font-size: 12px; color: #475569; }
    </style>
  </head>
  <body>
    <h1>Scroll Detect Web Tracker</h1>
    <p class="sub" id="dateLine">Loading…</p>
    <ul id="list"><li class="empty">No tracked social web use yet today.</li></ul>
    <button id="export">Export sessions (JSON)</button>
    <button class="secondary" id="send">Send to dashboard</button>
    <button class="secondary" id="clear">Clear today's data</button>
    <textarea id="out" readonly hidden placeholder="Export JSON appears here"></textarea>

    <script src="popup.js"></script>
  </body>
</html>
